name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分钟运行一次（UTC）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes, auto-select Cloudflare entries, and build page
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          OPTIMAL_API: "https://bestcf.pages.dev/random-region/JP/100.txt,https://bestcf.pages.dev/random-region/HK/100.txt"
          EDGE_TEST_TIMEOUT: "2.5"
          EDGE_TEST_REPEATS: "2"
          EDGE_TEST_CONCURRENCY: "48"
          EDGE_MAX_SELECTED: "20"
          NODES_URL: "https://yue1616.github.io/jiakuan1/nodes.txt"

      - name: Ensure GitHub Pages is enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "site: https://yue1616.github.io/jiakuan1/ (deploy outcome: ${{ steps.deployment.outcome }})"

